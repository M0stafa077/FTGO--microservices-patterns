# FTGO local infrastructure.
# Services run on the host (pnpm) during development and connect via localhost.
# Service containers get added here once each service has code.

name: ftgo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      # Single-node KRaft cluster (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:29092). EXTERNAL: host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 30

  # One-shot job: creates the topics listed in infra/kafka/topics.txt, keeps every event
  # topic's messages forever (a view or a replica rebuilds from offset zero), then exits.
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/topics.txt:/topics.txt:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        grep -v -e '^#' -e '^$$' /topics.txt | while read -r topic; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        grep '\.events$$' /topics.txt | while read -r topic; do
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 \
            --alter --entity-type topics --entity-name "$$topic" --add-config retention.ms=-1
        done
    restart: 'no'

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '${KAFKA_UI_PORT:-9088}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: ftgo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  postgres-data:
  kafka-data:
